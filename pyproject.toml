[project]
name = "dungeon-master-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Marcos Paegle", email = "marcos.paegle@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "typer>=0.27.3",
]

[project.scripts]
dungeon = "dungeon.cli:app"

[tool.uv.build-backend]
module-name = "dungeon"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]
