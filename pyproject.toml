[project]
name = "dungeon-master-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Marcos Paegle", email = "marcos.paegle@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fonttools>=4.66.1",
    "google-genai>=2.29.0",
    "httpx>=0.28.1",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.6.9",
    "langchain-google-genai>=4.4.0",
    "langchain-text-splitters>=1.1.3",
    "pypdf>=6.20.0",
    "python-dotenv>=1.2.4",
    "typer>=0.27.3",
]

[project.scripts]
dungeon = "dungeon.cli:app"

[tool.uv.build-backend]
module-name = "dungeon"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra"]
strict = true
