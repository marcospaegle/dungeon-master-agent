[project]
name = "dungeon-master-agent"
version = "0.1.0"
description = "A Dungeon Master agent for D&D 5.5e."
readme = "README.md"
authors = [
    { name = "Marcos Paegle", email = "marcos.paegle@gmail.com" }
]
requires-python = ">=3.14"
dependencies = ["dungeon-cli"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv.sources]
dungeon-cli = { workspace = true }
dungeon-core = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "ruff>=0.16.10",
]

[tool.pytest]
minversion = "9.0"
testpaths = ["packages", "apps"]
pythonpath = ["packages/core/tests"]
addopts = ["-ra"]
strict = true
