[project]
name = "dungeon-core"
version = "0.1.0"
description = "What every Dungeon Master Agent frontend shares."
requires-python = ">=3.14"
dependencies = [
    "deepagents>=0.7.24",
    "fonttools>=4.66.1",
    "google-genai>=2.29.0",
    "httpx>=0.28.1",
    "langchain>=1.4.4",
    "langchain-anthropic>=1.7.5",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.6.9",
    "langchain-google-genai>=4.4.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.14",
    "pypdf>=6.20.0",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
